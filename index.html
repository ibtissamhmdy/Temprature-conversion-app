<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A sleek temperature conversion app built with HTML, CSS, and JavaScript."
    />
    <title>Temperature Conversion App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="app-card" aria-labelledby="app-title">
        <p class="eyebrow">Portfolio Project</p>
        <h1 id="app-title">Temperature Conversion App</h1>
        <p class="subtitle">
          Convert temperatures instantly between Celsius and Fahrenheit.
        </p>

        <div class="input-group">
          <label for="textBox">Temperature</label>
          <input type="number" id="textBox" value="0" aria-label="Temperature value" />
        </div>

        <div class="unit-options" aria-label="Choose conversion direction">
          <label class="option">
            <input type="radio" name="unit" id="toFahrenheit" />
            <span>Celsius to Fahrenheit</span>
          </label>

          <label class="option">
            <input type="radio" name="unit" id="toCelsius" />
            <span>Fahrenheit to Celsius</span>
          </label>
        </div>

        <button id="convertBtn" type="button">Convert</button>

        <div class="result-box" aria-live="polite">
          <span>Result:</span>
          <strong id="result">Select a unit</strong>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
